<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PJSA Admin Chat</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:sans-serif }
    body { background:#0d1117; color:#fff; padding:15px }
    .container { max-width:500px; margin:0 auto }
    h1 { text-align:center; color:#58a6ff; margin-bottom:20px }
    input, button { width:100%; padding:12px; margin:6px 0; border-radius:8px; border:1px solid #30363d; background:#161b22; color:#fff; font-size:16px }
    button { background:#238636; border:none; font-weight:bold; cursor:pointer }
    .msg { background:#161b22; padding:12px; border-radius:8px; margin-bottom:8px; border:1px solid #30363d }
    .name { color:#58a6ff; font-weight:bold }
    .time { color:#7d8590; font-size:12px }
    #loginBox, #chatBox { background:#161b22; padding:20px; border-radius:12px; border:1px solid #30363d }
  </style>
</head>
<body>
  <div class="container">
    <h1>PJSA Admin Chat 💬</h1>
    
    <div id="loginBox">
      <input type="text" id="nameInput" placeholder="Apna Naam Daal">
      <button onclick="joinChat()">Chat Join Karo</button>
    </div>

    <div id="chatBox" style="display:none;">
      <input type="text" id="msgInput" placeholder="Message likho...">
      <button onclick="sendMsg()">Bhej Do</button>
      <div id="messages" style="margin-top:20px"></div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, push, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDYx4J91emnIUEjd9atbgBYI_L56cAeXM4",
      authDomain: "pjsa-app-37a0a.firebaseapp.com",
      databaseURL: "https://pjsa-app-37a0a-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "pjsa-app-37a0a",
      storageBucket: "pjsa-app-37a0a.firebasestorage.app",
      messagingSenderId: "397051686564",
      appId: "1:397051686564:web:330a296473c63f339e8031"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    let username = "";

    window.joinChat = function() {
      username = document.getElementById('nameInput').value.trim();
      if(username) {
        document.getElementById('loginBox').style.display = 'none';
        document.getElementById('chatBox').style.display = 'block';
        loadMsgs();
      }
    }

    window.sendMsg = function() {
      const text = document.getElementById('msgInput').value.trim();
      if(text) {
        push(ref(db, 'pjsaadmin'), {
          name: username,
          text: text,
          time: new Date().toLocaleString('hi-IN')
        });
        document.getElementById('msgInput').value = '';
      }
    }

    function loadMsgs() {
      onValue(ref(db, 'pjsaadmin'), (snap) => {
        const msgsDiv = document.getElementById('messages');
        msgsDiv.innerHTML = '';
        const data = snap.val();
        if(data) {
          Object.values(data).forEach(msg => {
            msgsDiv.innerHTML += `
              <div class="msg">
                <div class="name">${msg.name}</div>
                <div>${msg.text}</div>
                <div class="time">${msg.time}</div>
              </div>`;
          });
          msgsDiv.scrollTop = msgsDiv.scrollHeight;
        }
      });
    }
  </script>
</body>
</html>
