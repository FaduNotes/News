<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PJSA Admin Panel</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:sans-serif }
    body { background:#0d1117; color:#fff; padding:15px }
    .container { max-width:500px; margin:0 auto }
    h1 { text-align:center; color:#f85149; margin-bottom:20px }
    input, button { width:100%; padding:12px; margin:6px 0; border-radius:8px; border:1px solid #30363d; background:#161b22; color:#fff }
    button { background:#da3633; border:none; font-weight:bold; cursor:pointer }
    .msg { background:#161b22; padding:12px; border-radius:8px; margin-bottom:8px; border:1px solid #30363d; position:relative }
    .deleteBtn { width:auto; padding:6px 12px; font-size:12px; position:absolute; right:10px; top:10px }
    .name { color:#58a6ff; font-weight:bold }
    .time { color:#7d8590; font-size:12px }
  </style>
</head>
<body>
  <div class="container">
    <h1>PJSA Admin Panel 🔒</h1>
    
    <div id="loginBox">
      <input type="password" id="passInput" placeholder="Admin Password">
      <button onclick="login()">Login</button>
    </div>

    <div id="adminBox" style="display:none;">
      <h3>All Messages:</h3>
      <div id="messages"></div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, onValue, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDYx4J91emnIUEjd9atbgBYI_L56cAeXM4",
      authDomain: "pjsa-app-37a0a.firebaseapp.com",
      databaseURL: "https://pjsa-app-37a0a-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "pjsa-app-37a0a",
      storageBucket: "pjsa-app-37a0a.firebasestorage.app",
      messagingSenderId: "397051686564",
      appId: "1:397051686564:web:330a296473c63f339e8031"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const ADMIN_PASS = "pjsa@admin";

    window.login = function() {
      if(document.getElementById('passInput').value === ADMIN_PASS) {
        document.getElementById('loginBox').style.display = 'none';
        document.getElementById('adminBox').style.display = 'block';
        loadMsgs();
      } else {
        alert('Galat Password');
      }
    }

    function loadMsgs() {
      onValue(ref(db, 'pjsaadmin'), (snap) => {
        const msgsDiv = document.getElementById('messages');
        msgsDiv.innerHTML = '';
        const data = snap.val();
        if(data) {
          Object.entries(data).reverse().forEach(([key, msg]) => {
            msgsDiv.innerHTML += `
              <div class="msg">
                <button class="deleteBtn" onclick="delMsg('${key}')">Delete</button>
                <div class="name">${msg.name}</div>
                <div>${msg.text}</div>
                <div class="time">${msg.time}</div>
              </div>`;
          });
        }
      });
    }

    window.delMsg = function(key) {
      if(confirm('Pakka delete karna hai?')) {
        remove(ref(db, 'pjsaadmin/' + key));
      }
    }
  </script>
</body>
</html>
